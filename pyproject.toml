[project]
name = "triathlon-agent"
version = "0.1.0"
description = "Triathlon training agents over Garmin + TrainingPeaks data (uv workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = ["tri-core", "tri-analyze", "tri-planning", "tri-nutrition", "tri-wellness"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tri-core = { workspace = true }
tri-analyze = { workspace = true }
tri-planning = { workspace = true }
tri-nutrition = { workspace = true }
tri-wellness = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
addopts = "--import-mode=importlib"
markers = [
    "db: needs a reachable Postgres (skips otherwise)",
    "live: talks to real MCP servers (opt-in with --live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tri_core", "tri_analyze", "tri_planning", "tri_nutrition", "tri_wellness"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/tri-core/src", "packages/tri-analyze/src", "packages/tri-planning/src", "packages/tri-nutrition/src", "packages/tri-wellness/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langchain_mcp_adapters.*", "mcp.*"]
ignore_missing_imports = true
