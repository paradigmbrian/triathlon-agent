[project]
name = "tri-analyze-agent"
version = "0.1.0"
description = "Triathlon training analysis agent over Garmin + TrainingPeaks data"
authors = [
    { name = "Brian Flannery", email = "brian@paradigmshiftdev.io" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain==1.4.0",
    "langchain-anthropic==1.7.1",
    "langchain-mcp-adapters==0.3.2",
    "psycopg[binary]==3.3.5",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13",
]

[project.scripts]
tri-analyze = "tri_analyze.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tri_analyze"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: needs a reachable Postgres (skips otherwise)",
    "live: talks to real MCP servers (opt-in with --live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langchain_mcp_adapters.*", "mcp.*"]
ignore_missing_imports = true
