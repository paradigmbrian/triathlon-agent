[project]
name = "tri-analyze"
version = "0.1.0"
description = "Triathlon training analysis agent over Garmin + TrainingPeaks data"
authors = [{ name = "Brian Flannery", email = "brian@paradigmshiftdev.io" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "tri-core",
    "langchain==1.4.0",
    "langchain-anthropic==1.7.1",
    "langchain-mcp-adapters==0.3.2",
    "langsmith>=0.12,<1",
    "psycopg[binary]==3.3.5",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13",
]

[project.scripts]
tri-analyze = "tri_analyze.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tri_analyze"]

[tool.uv.sources]
tri-core = { workspace = true }
