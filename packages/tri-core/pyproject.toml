[project]
name = "tri-core"
version = "0.1.0"
description = "Shared settings, MCP client, Postgres store and sync for the triathlon agents"
authors = [{ name = "Brian Flannery", email = "brian@paradigmshiftdev.io" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.29,<2",
    "psycopg[binary]==3.3.5",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13",
    "langchain-core>=1.0,<2",  # only for tri_core.testing.fakes.ScriptedChatModel
    "pytest>=8.3",             # only for tri_core.testing.fixtures
]

[project.scripts]
tri = "tri_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tri_core"]
