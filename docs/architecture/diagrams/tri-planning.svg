<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="pl-title">
<title id="pl-title">tri-planning graph: route by phase to intake, targets and design, or adjust; review then apply writes TrainingPeaks</title>
<style>
svg { --bg:#F8FAF9; --ink:#16201E; --muted:#5A6A66; --rule:#C3CECB; --sys:#EDF2F0; --acc:#0E6B66; --tint:#DAEAE7; --accline:#8DBDB7; --w:#B4470F; --wtint:#F6E4D8; --sans:-apple-system,"Segoe UI","Public Sans",Helvetica,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
@media (prefers-color-scheme: dark) { svg { --bg:#151D1C; --ink:#E2EAE8; --muted:#93A39F; --rule:#2C3836; --sys:#1C2725; --acc:#5BBDB4; --tint:#15302E; --accline:#2F6660; --w:#EE8C4E; --wtint:#3A2518; } }
.bg { fill:var(--bg); }
.bx { fill:var(--bg); stroke:var(--rule); stroke-width:1; }
.bl { fill:var(--tint); stroke:var(--accline); stroke-width:1; fill-opacity:.55; }
.ba { fill:var(--tint); stroke:var(--acc); stroke-width:1.4; }
.bs { fill:var(--bg); stroke:var(--acc); stroke-width:1.4; }
.bw { fill:var(--wtint); stroke:var(--w); stroke-width:1.4; }
.bs2 { fill:var(--sys); stroke:var(--muted); stroke-width:1; stroke-dasharray:4 3; }
.ln { fill:none; stroke:var(--ink); stroke-width:1.4; }
.la { fill:none; stroke:var(--acc); stroke-width:1.4; }
.lw { fill:none; stroke:var(--w); stroke-width:1.6; }
.dash { stroke-dasharray:5 4; }
.ah { fill:var(--ink); } .ah-c { fill:var(--acc); } .ah-w { fill:var(--w); }
.dot { fill:var(--ink); } .ring { fill:none; stroke:var(--ink); stroke-width:1.4; }
.t { font:600 13px var(--sans); fill:var(--ink); }
.s { font:600 12px var(--sans); fill:var(--ink); }
.ss { font:500 11px var(--sans); fill:var(--ink); }
.m { font:400 11px var(--mono); fill:var(--muted); }
.mi { font:400 11px var(--mono); fill:var(--ink); }
.m10 { font:400 10px var(--mono); fill:var(--muted); }
.ma { font:500 11px var(--mono); fill:var(--acc); }
.ma10 { font:500 10px var(--mono); fill:var(--acc); }
.mw { font:500 10.5px var(--mono); fill:var(--w); }
.lab { font:600 10.5px var(--mono); letter-spacing:.08em; fill:var(--muted); }
</style>
<defs><marker id="pl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="pl-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-c"/></marker><marker id="pl-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-w"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="440"/>
<circle class="dot" cx="22" cy="215" r="6"/>
<text class="m10" x="22" y="237" text-anchor="middle">START</text>
<path class="ln" d="M28 215 H45" marker-end="url(#pl-a)"/>
<rect class="bx" x="48" y="195" width="90" height="40" rx="3"/>
<text class="mi" x="93.0" y="211.0" text-anchor="middle">route</text>
<text class="m10" x="93.0" y="227.0" text-anchor="middle">derive_phase</text>
<path class="ln" d="M70 195 V24 H665 V187" marker-end="url(#pl-a)"/>
<text class="m10" x="380" y="18" text-anchor="middle">pending changes → review</text>
<rect class="ba" x="190" y="50" width="130" height="50" rx="3"/>
<text class="s" x="255.0" y="71.0" text-anchor="middle">intake</text>
<text class="m10" x="255.0" y="87.0" text-anchor="middle">agent loop</text>
<path class="ln" d="M110 195 V75 H187" marker-end="url(#pl-a)"/>
<text class="m10" x="118" y="132">intake</text>
<rect class="bx" x="190" y="190" width="130" height="50" rx="3"/>
<text class="s" x="255.0" y="211.0" text-anchor="middle">targets</text>
<text class="m10" x="255.0" y="227.0" text-anchor="middle">code · WeekTargets</text>
<path class="ln" d="M138 215 H187" marker-end="url(#pl-a)"/>
<text class="m10" x="163" y="209" text-anchor="middle">planning</text>
<rect class="ba" x="190" y="330" width="130" height="50" rx="3"/>
<text class="s" x="255.0" y="351.0" text-anchor="middle">adjust</text>
<text class="m10" x="255.0" y="367.0" text-anchor="middle">agent loop</text>
<path class="ln" d="M110 235 V355 H187" marker-end="url(#pl-a)"/>
<text class="m10" x="118" y="300">active</text>
<path class="ln" d="M255 100 V187" marker-end="url(#pl-a)"/>
<text class="m10" x="263" y="150">goal set</text>
<rect class="bs" x="400" y="190" width="130" height="50" rx="3"/>
<text class="s" x="465.0" y="211.0" text-anchor="middle">design</text>
<text class="m10" x="465.0" y="227.0" text-anchor="middle">one call per week</text>
<path class="ln" d="M320 215 H397" marker-end="url(#pl-a)"/>
<text class="m10" x="358" y="209" text-anchor="middle">to design</text>
<rect class="bw" x="610" y="190" width="110" height="50" rx="3"/>
<text class="s" x="665.0" y="211.0" text-anchor="middle">review</text>
<text class="m10" x="665.0" y="227.0" text-anchor="middle">interrupt()</text>
<path class="ln" d="M530 215 H607" marker-end="url(#pl-a)"/>
<text class="m10" x="568" y="209" text-anchor="middle">proposal</text>
<path class="ln" d="M290 240 V285 H650 V243" marker-end="url(#pl-a)"/>
<text class="m10" x="470" y="279" text-anchor="middle">pending</text>
<path class="ln" d="M320 355 H690 V243" marker-end="url(#pl-a)"/>
<text class="m10" x="505" y="349" text-anchor="middle">proposal</text>
<path class="ln dash" d="M640 190 V160 H465 V187" marker-end="url(#pl-a)"/>
<text class="m10" x="552" y="154" text-anchor="middle">reject → design or adjust</text>
<rect class="bw" x="820" y="190" width="100" height="50" rx="3"/>
<text class="s" x="870.0" y="211.0" text-anchor="middle">apply</text>
<text class="m10" x="870.0" y="227.0" text-anchor="middle">only TP writer</text>
<path class="lw" d="M720 215 H817" marker-end="url(#pl-w)"/>
<text class="mw" x="768" y="207" text-anchor="middle">approve · edit</text>
<rect class="bs2" x="800" y="60" width="140" height="50" rx="3"/>
<text class="s" x="870.0" y="81.0" text-anchor="middle">TrainingPeaks</text>
<text class="m10" x="870.0" y="97.0" text-anchor="middle">calendar · events</text>
<path class="lw" d="M870 190 V113" marker-end="url(#pl-w)"/>
<text class="mw" x="878" y="150">recorded_write</text>
<text class="m10" x="878" y="165">→ plan_changes</text>
<path class="ln" d="M870 240 V287" marker-end="url(#pl-a)"/>
<rect class="bx" x="810" y="290" width="120" height="24" rx="12"/>
<text class="mi" x="870" y="306" text-anchor="middle">→ targets</text>
<text class="m10" x="802" y="306" text-anchor="end">TP plan applied</text>
<text class="m10" x="22" y="425">Nodes with nothing pending end the run; those END edges are left out.</text>
</svg>
