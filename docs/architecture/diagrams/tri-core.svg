<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="co-title">
<title id="co-title">tri-core: six modules every package builds on</title>
<style>
svg { --bg:#F8FAF9; --ink:#16201E; --muted:#5A6A66; --rule:#C3CECB; --sys:#EDF2F0; --acc:#0E6B66; --tint:#DAEAE7; --accline:#8DBDB7; --w:#B4470F; --wtint:#F6E4D8; --sans:-apple-system,"Segoe UI","Public Sans",Helvetica,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
@media (prefers-color-scheme: dark) { svg { --bg:#151D1C; --ink:#E2EAE8; --muted:#93A39F; --rule:#2C3836; --sys:#1C2725; --acc:#5BBDB4; --tint:#15302E; --accline:#2F6660; --w:#EE8C4E; --wtint:#3A2518; } }
.bg { fill:var(--bg); }
.bx { fill:var(--bg); stroke:var(--rule); stroke-width:1; }
.bl { fill:var(--tint); stroke:var(--accline); stroke-width:1; fill-opacity:.55; }
.ba { fill:var(--tint); stroke:var(--acc); stroke-width:1.4; }
.bs { fill:var(--bg); stroke:var(--acc); stroke-width:1.4; }
.bw { fill:var(--wtint); stroke:var(--w); stroke-width:1.4; }
.bs2 { fill:var(--sys); stroke:var(--muted); stroke-width:1; stroke-dasharray:4 3; }
.ln { fill:none; stroke:var(--ink); stroke-width:1.4; }
.la { fill:none; stroke:var(--acc); stroke-width:1.4; }
.lw { fill:none; stroke:var(--w); stroke-width:1.6; }
.dash { stroke-dasharray:5 4; }
.ah { fill:var(--ink); } .ah-c { fill:var(--acc); } .ah-w { fill:var(--w); }
.dot { fill:var(--ink); } .ring { fill:none; stroke:var(--ink); stroke-width:1.4; }
.t { font:600 13px var(--sans); fill:var(--ink); }
.s { font:600 12px var(--sans); fill:var(--ink); }
.ss { font:500 11px var(--sans); fill:var(--ink); }
.m { font:400 11px var(--mono); fill:var(--muted); }
.mi { font:400 11px var(--mono); fill:var(--ink); }
.m10 { font:400 10px var(--mono); fill:var(--muted); }
.ma { font:500 11px var(--mono); fill:var(--acc); }
.ma10 { font:500 10px var(--mono); fill:var(--acc); }
.mw { font:500 10.5px var(--mono); fill:var(--w); }
.lab { font:600 10.5px var(--mono); letter-spacing:.08em; fill:var(--muted); }
</style>
<defs><marker id="co-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="co-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-c"/></marker><marker id="co-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-w"/></marker></defs>
