<text class="ss" x="579.0" y="155" text-anchor="middle">sonnet-5</text>
<text class="m10" x="361" y="182">first two that differ from the primary</text>
<text class="mi" x="361" y="206">carriers</text>
<text class="m10" x="361" y="221">claude_fallback · structured() · streaming()</text>
<text class="m10" x="361" y="246">analyst: opus-5, medium · fuel: sonnet-5</text>
<text class="m10" x="361" y="261">every other role: opus-5 · labs 32k tokens</text>
<text class="lab" x="686" y="72">WRITE · writes.recorded_write</text>
<rect class="bw" x="686" y="80" width="66" height="22" rx="11"/>
<text class="ss" x="719.0" y="95" text-anchor="middle">pending</text>
<path class="lw" d="M752 91 H763" marker-end="url(#co-w)"/>
<rect class="bw" x="766" y="80" width="76" height="22" rx="11"/>
<text class="ss" x="804.0" y="95" text-anchor="middle">MCP call</text>
<path class="lw" d="M842 91 H853" marker-end="url(#co-w)"/>
<rect class="bw" x="856" y="80" width="66" height="22" rx="11"/>
<text class="ss" x="889.0" y="95" text-anchor="middle">applied</text>
<text class="m10" x="686" y="120">definitive rejection → failed</text>
<text class="m10" x="686" y="134">anything else stays pending: OutcomeUnknown</text>
<text class="lab" x="686" y="162">READ · sql_tool</text>
<text class="mi" x="686" y="178">query_training_db as tri_reader</text>
<text class="m10" x="686" y="193">one SELECT / WITH · read-only txn</text>
<text class="m10" x="686" y="207">5 s timeout · 200 rows · 8,000 chars</text>
<text class="lab" x="686" y="234">MIGRATE · tri migrate</text>
<text class="m10" x="686" y="250">001–010 → schema_migrations (sha256)</text>
<text class="m10" x="686" y="264">+ LangGraph checkpoint and store tables</text>
<text class="mi" x="36" y="352">garmin_spec · trainingpeaks_spec</text>
<text class="m10" x="36" y="368">uvx from git at a pinned ref</text>
<text class="m10" x="36" y="383">child_env: PATH, HOME, TMPDIR, LANG only</text>
<text class="lab" x="36" y="412">THREE WAYS IN</text>
<text class="mi" x="36" y="432">McpToolClient</text>
<text class="m10" x="170" y="432">sync · call_json</text>
<text class="mi" x="36" y="452">open_live_servers</text>
<text class="m10" x="170" y="452">agents · allowlist filter</text>
<text class="mi" x="36" y="472">ToolsCaller</text>
<text class="m10" x="170" y="472">apply&#x27;s writes</text>
<text class="m10" x="36" y="506">one session per server per process</text>
<text class="m10" x="36" y="521">a server that fails to start is skipped</text>
<text class="m10" x="36" y="536">the servers never see API keys or DB URLs</text>
<rect class="bx" x="361" y="342" width="70" height="22" rx="11"/>
<text class="ss" x="396.0" y="357" text-anchor="middle">tri sync</text>
<path class="ln" d="M431 353 H442" marker-end="url(#co-a)"/>
<rect class="bx" x="445" y="342" width="76" height="22" rx="11"/>
<text class="ss" x="483.0" y="357" text-anchor="middle">run_sync</text>
<text class="mi" x="361" y="388">TrainingPeaks</text>
<text class="m10" x="465" y="388">365 d back · 28 d ahead</text>
<text class="m10" x="361" y="404">→ athlete_profile · workouts · daily_metrics</text>
<text class="mi" x="361" y="430">Garmin</text>
<text class="m10" x="465" y="430">60 d back</text>
<text class="m10" x="361" y="446">→ daily_metrics · garmin_activities</text>
<text class="m10" x="361" y="461">→ match_activities → linked to workouts</text>
<text class="m10" x="361" y="490">sync_state watermark, 3-day overlap</text>
<text class="m10" x="361" y="505">one source failing keeps the other</text>
<text class="m10" x="361" y="534">also run by /sync, check-in, web jobs</text>
<rect class="bx" x="686" y="342" width="60" height="22" rx="11"/>
