<path class="ln" d="M222 123 H233" marker-end="url(#co-a)"/>
<rect class="bx" x="236" y="112" width="84" height="22" rx="11"/>
<text class="ss" x="278.0" y="127" text-anchor="middle">caching</text>
<text class="mi" x="36" y="162">agent_tool</text>
<text class="m10" x="36" y="177">an agent as a one-question tool</text>
<text class="mi" x="36" y="194">handoff</text>
<text class="m10" x="36" y="209">Command.PARENT with a valid history</text>
<text class="mi" x="36" y="226">persistence</text>
<text class="m10" x="36" y="241">Postgres saver + Store, readiness</text>
<text class="mi" x="36" y="258">turns · messages</text>
<text class="m10" x="36" y="273">one stream loop for REPLs and web</text>
