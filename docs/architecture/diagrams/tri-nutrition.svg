<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="nu-title">
<title id="nu-title">tri-nutrition graph: route to intake, check-in or targets; fuel plans; review then apply writes Garmin and TrainingPeaks</title>
<style>
svg { --bg:#F8FAF9; --ink:#16201E; --muted:#5A6A66; --rule:#C3CECB; --sys:#EDF2F0; --acc:#0E6B66; --tint:#DAEAE7; --accline:#8DBDB7; --w:#B4470F; --wtint:#F6E4D8; --sans:-apple-system,"Segoe UI","Public Sans",Helvetica,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
@media (prefers-color-scheme: dark) { svg { --bg:#151D1C; --ink:#E2EAE8; --muted:#93A39F; --rule:#2C3836; --sys:#1C2725; --acc:#5BBDB4; --tint:#15302E; --accline:#2F6660; --w:#EE8C4E; --wtint:#3A2518; } }
.bg { fill:var(--bg); }
.bx { fill:var(--bg); stroke:var(--rule); stroke-width:1; }
.bl { fill:var(--tint); stroke:var(--accline); stroke-width:1; fill-opacity:.55; }
.ba { fill:var(--tint); stroke:var(--acc); stroke-width:1.4; }
.bs { fill:var(--bg); stroke:var(--acc); stroke-width:1.4; }
.bw { fill:var(--wtint); stroke:var(--w); stroke-width:1.4; }
.bs2 { fill:var(--sys); stroke:var(--muted); stroke-width:1; stroke-dasharray:4 3; }
.ln { fill:none; stroke:var(--ink); stroke-width:1.4; }
.la { fill:none; stroke:var(--acc); stroke-width:1.4; }
.lw { fill:none; stroke:var(--w); stroke-width:1.6; }
.dash { stroke-dasharray:5 4; }
.ah { fill:var(--ink); } .ah-c { fill:var(--acc); } .ah-w { fill:var(--w); }
.dot { fill:var(--ink); } .ring { fill:none; stroke:var(--ink); stroke-width:1.4; }
.t { font:600 13px var(--sans); fill:var(--ink); }
.s { font:600 12px var(--sans); fill:var(--ink); }
.ss { font:500 11px var(--sans); fill:var(--ink); }
.m { font:400 11px var(--mono); fill:var(--muted); }
.mi { font:400 11px var(--mono); fill:var(--ink); }
.m10 { font:400 10px var(--mono); fill:var(--muted); }
.ma { font:500 11px var(--mono); fill:var(--acc); }
.ma10 { font:500 10px var(--mono); fill:var(--acc); }
.mw { font:500 10.5px var(--mono); fill:var(--w); }
.lab { font:600 10.5px var(--mono); letter-spacing:.08em; fill:var(--muted); }
</style>
<defs><marker id="nu-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="nu-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-c"/></marker><marker id="nu-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-w"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="440"/>
<circle class="dot" cx="22" cy="215" r="6"/>
<text class="m10" x="22" y="237" text-anchor="middle">START</text>
<path class="ln" d="M28 215 H45" marker-end="url(#nu-a)"/>
<rect class="bx" x="48" y="195" width="90" height="40" rx="3"/>
<text class="mi" x="93.0" y="211.0" text-anchor="middle">route</text>
<text class="m10" x="93.0" y="227.0" text-anchor="middle">Store profile?</text>
<path class="ln" d="M70 195 V24 H790 V187" marker-end="url(#nu-a)"/>
<text class="m10" x="420" y="18" text-anchor="middle">pending changes → review</text>
<rect class="ba" x="190" y="50" width="130" height="50" rx="3"/>
<text class="s" x="255.0" y="71.0" text-anchor="middle">intake</text>
<text class="m10" x="255.0" y="87.0" text-anchor="middle">agent loop</text>
<path class="ln" d="M110 195 V75 H187" marker-end="url(#nu-a)"/>
<text class="m10" x="118" y="132">no profile</text>
<rect class="ba" x="190" y="330" width="130" height="50" rx="3"/>
<text class="s" x="255.0" y="351.0" text-anchor="middle">check-in</text>
<text class="m10" x="255.0" y="367.0" text-anchor="middle">agent loop</text>
<path class="ln" d="M110 235 V355 H187" marker-end="url(#nu-a)"/>
<text class="m10" x="118" y="300">profile</text>
<rect class="bx" x="380" y="190" width="120" height="50" rx="3"/>
<text class="s" x="440.0" y="211.0" text-anchor="middle">targets</text>
<text class="m10" x="440.0" y="227.0" text-anchor="middle">code · bounds</text>
<path class="ln" d="M138 215 H377" marker-end="url(#nu-a)"/>
<text class="m10" x="258" y="209" text-anchor="middle">targets_requested</text>
<path class="ln" d="M320 75 H440 V187" marker-end="url(#nu-a)"/>
<text class="m10" x="380" y="69" text-anchor="middle">profile_saved</text>
<path class="ln" d="M320 355 H440 V243" marker-end="url(#nu-a)"/>
<text class="m10" x="328" y="349">saved or asked</text>
<rect class="bs" x="560" y="190" width="120" height="50" rx="3"/>
<text class="s" x="620.0" y="211.0" text-anchor="middle">fuel</text>
<text class="m10" x="620.0" y="227.0" text-anchor="middle">NUTRITION_FUEL</text>
<path class="ln" d="M500 215 H557" marker-end="url(#nu-a)"/>
<text class="m10" x="528" y="209" text-anchor="middle">no error</text>
<rect class="bw" x="740" y="190" width="100" height="50" rx="3"/>
<text class="s" x="790.0" y="211.0" text-anchor="middle">review</text>
<text class="m10" x="790.0" y="227.0" text-anchor="middle">interrupt()</text>
<path class="ln" d="M680 215 H737" marker-end="url(#nu-a)"/>
<text class="m10" x="708" y="209" text-anchor="middle">changes</text>
<path class="ln dash" d="M790 240 V410 H255 V383" marker-end="url(#nu-a)"/>
<text class="m10" x="520" y="404" text-anchor="middle">reject → intake or check-in (regenerate_from)</text>
<rect class="bw" x="890" y="190" width="90" height="50" rx="3"/>
<text class="s" x="935.0" y="211.0" text-anchor="middle">apply</text>
<text class="m10" x="935.0" y="227.0" text-anchor="middle">writes</text>
<path class="lw" d="M840 215 H887" marker-end="url(#nu-w)"/>
<text class="mw" x="863" y="207" text-anchor="middle">approve</text>
<rect class="bs2" x="860" y="50" width="130" height="60" rx="3"/>
<text class="s" x="925.0" y="69.0" text-anchor="middle">Garmin · TP</text>
<text class="m10" x="925.0" y="85.0" text-anchor="middle">daily targets</text>
<text class="m10" x="925.0" y="99.0" text-anchor="middle">fuel notes</text>
<path class="lw" d="M935 190 V113" marker-end="url(#nu-w)"/>
<text class="mw" x="927" y="150" text-anchor="end">recorded_write</text>
<text class="m10" x="927" y="165" text-anchor="end">→ nutrition_changes</text>
<path class="ln" d="M935 240 V271" marker-end="url(#nu-a)"/>
<circle class="ring" cx="935" cy="282" r="8"/><circle class="dot" cx="935" cy="282" r="3.5"/>
<text class="m10" x="935" y="306" text-anchor="middle">END</text>
<text class="m10" x="22" y="434">Nodes with nothing to propose end the run. Embedded in the coach, the graph stops after fuel.</text>
</svg>
