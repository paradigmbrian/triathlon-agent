<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img" aria-labelledby="layers-title layers-desc">
  <title id="layers-title">One coach turn, layer by layer</title>
  <desc id="layers-desc">Hosts call run_turn on harness.turns. open_runtime opens the checkpointer and store through harness.persistence and builds the coach StateGraph. The coach node runs a create_agent loop built by harness.agents.make_subagent with one tool call per step, a Claude fallback, and prompt caching last. Its tools include handoffs built on harness.handoff and ask_analyst and ask_wellness built on harness.agent_tool. apply writes through ToolsCaller without passing through a model loop. State checkpoints to Postgres.</desc>
  <style>
    svg {
      --surface: #F8FAF9; --ink: #16201E; --muted: #5A6A66; --rule: #C3CECB;
      --acc: #0E6B66; --acc-tint: #DAEAE7; --acc-line: #8DBDB7; --w: #B4470F; --w-tint: #F6E4D8;
      --sans: -apple-system, "Segoe UI", "Public Sans", Helvetica, Arial, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #151D1C; --ink: #E2EAE8; --muted: #93A39F; --rule: #2C3836;
        --acc: #5BBDB4; --acc-tint: #15302E; --acc-line: #2F6660; --w: #EE8C4E; --w-tint: #3A2518;
      }
    }
    .bg { fill: var(--surface); }
    .b-n { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
    .b-layer { fill: var(--acc-tint); stroke: var(--acc-line); stroke-width: 1; }
    .b-acc { fill: var(--acc-tint); stroke: var(--acc); stroke-width: 1.4; }
    .b-accn { fill: var(--surface); stroke: var(--acc); stroke-width: 1.4; }
    .b-w { fill: var(--w-tint); stroke: var(--w); stroke-width: 1.4; }
    .ln { fill: none; stroke: var(--ink); stroke-width: 1.4; }
    .ln-w { fill: none; stroke: var(--w); stroke-width: 1.6; }
    .dash { stroke-dasharray: 5 4; }
    .ah-ink { fill: var(--ink); }
    .ah-w { fill: var(--w); }
    .t { font: 600 13px var(--sans); fill: var(--ink); }
    .s { font: 600 12px var(--sans); fill: var(--ink); }
    .ss { font: 500 11px var(--sans); fill: var(--ink); }
    .m { font: 400 11px var(--mono); fill: var(--muted); }
    .mi { font: 400 11px var(--mono); fill: var(--ink); }
    .m10 { font: 400 10px var(--mono); fill: var(--muted); }
    .ma { font: 500 11px var(--mono); fill: var(--acc); }
    .ma10 { font: 500 10px var(--mono); fill: var(--acc); }
    .mw { font: 500 11px var(--mono); fill: var(--w); }
    .lab { font: 600 10.5px var(--mono); letter-spacing: 0.08em; fill: var(--muted); }
  </style>
  <defs>
    <marker id="layers-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah-ink"/></marker>
    <marker id="layers-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah-w"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="820"/>

  <text class="lab" x="132" y="56" text-anchor="end">HOSTS</text>
  <text class="lab" x="132" y="152" text-anchor="end">WIRING</text>
  <text class="lab" x="132" y="275" text-anchor="end">ORCHESTRATION</text>
  <text class="lab" x="132" y="429" text-anchor="end">INNER LOOP</text>
  <text class="lab" x="132" y="614" text-anchor="end">TOOL PLANE</text>
  <text class="lab" x="132" y="772" text-anchor="end">SYSTEMS</text>

  <!-- hosts -->
  <rect class="b-n" x="150" y="20" width="190" height="64" rx="4"/>
  <text class="t" x="245" y="47" text-anchor="middle">Terminal REPL</text>
  <text class="m" x="245" y="66" text-anchor="middle">run_turn · TurnPrinter</text>
  <rect class="b-n" x="360" y="20" width="190" height="64" rx="4"/>
  <text class="t" x="455" y="47" text-anchor="middle">tri-web</text>
  <text class="m" x="455" y="66" text-anchor="middle">SSE · TurnEmitter · lock</text>
  <rect class="b-n" x="570" y="20" width="190" height="64" rx="4"/>
  <text class="t" x="665" y="47" text-anchor="middle">Evals</text>
  <text class="m" x="665" y="66" text-anchor="middle">evals/target.py</text>

  <path class="ln" d="M455 84 V117" marker-end="url(#layers-a)"/>
  <text class="mi" x="465" y="105">message · Command(resume)</text>
  <text class="ma" x="445" y="105" text-anchor="end">harness.turns</text>

  <!-- wiring -->
  <rect class="b-layer" x="150" y="120" width="610" height="56" rx="4"/>
  <text class="t" x="170" y="144">open_runtime</text>
  <text class="ma" x="744" y="144" text-anchor="end">harness.persistence</text>
  <text class="m" x="170" y="164">MCP sessions → open_checkpointer → open_store → deps → build_graph</text>

  <path class="ln" d="M455 176 V209" marker-end="url(#layers-a)"/>
  <text class="mi" x="465" y="197">thread "coach" · recursion_limit 60</text>

  <!-- orchestration -->
  <rect class="b-layer" x="150" y="212" width="610" height="118" rx="4"/>
  <text class="t" x="170" y="237">coach StateGraph</text>
  <text class="m" x="744" y="237" text-anchor="end">graph/graph.py</text>

  <rect class="b-acc" x="166" y="252" width="106" height="48" rx="3"/>
  <text class="s" x="219" y="273" text-anchor="middle">coach</text>
  <text class="m10" x="219" y="290" text-anchor="middle">fresh prompt</text>
  <rect class="b-n" x="284" y="252" width="106" height="48" rx="3"/>
  <text class="s" x="337" y="273" text-anchor="middle">planning</text>
  <text class="m10" x="337" y="290" text-anchor="middle">embedded</text>
  <rect class="b-n" x="402" y="252" width="106" height="48" rx="3"/>
  <text class="s" x="455" y="273" text-anchor="middle">nutrition</text>
  <text class="m10" x="455" y="290" text-anchor="middle">embedded</text>
  <rect class="b-w" x="520" y="252" width="106" height="48" rx="3"/>
  <text class="s" x="573" y="273" text-anchor="middle">review</text>
  <text class="m10" x="573" y="290" text-anchor="middle">interrupt()</text>
  <rect class="b-w" x="638" y="252" width="106" height="48" rx="3"/>
  <text class="s" x="691" y="273" text-anchor="middle">apply</text>
  <text class="m10" x="691" y="290" text-anchor="middle">only writer</text>

  <!-- durable state -->
  <path class="ln" d="M760 271 H827" marker-end="url(#layers-a)"/>
  <text class="mi" x="794" y="263" text-anchor="middle">saves</text>
  <rect class="b-n" x="830" y="212" width="160" height="118" rx="4"/>
  <text class="t" x="846" y="237">Postgres state</text>
  <text class="m" x="846" y="260">checkpoints</text>
  <text class="m" x="846" y="276">thread "coach"</text>
  <text class="m" x="846" y="298">Store · memory</text>
  <text class="m" x="846" y="314">STATE_TYPES serde</text>

  <path class="ln" d="M219 300 V367" marker-end="url(#layers-a)"/>
  <text class="mi" x="229" y="340">each turn</text>

  <!-- inner loop -->
  <rect class="b-layer" x="150" y="370" width="610" height="110" rx="4"/>
  <text class="t" x="170" y="392">create_agent loop</text>
  <text class="ma" x="304" y="392">harness.agents.make_subagent</text>

  <rect class="b-n" x="166" y="405" width="130" height="60" rx="3"/>
  <text class="s" x="231" y="432" text-anchor="middle">model</text>
  <text class="m10" x="231" y="450" text-anchor="middle">tri_core.llm · per role</text>
  <rect class="b-n" x="380" y="405" width="140" height="60" rx="3"/>
  <text class="s" x="450" y="432" text-anchor="middle">tools</text>
  <text class="m10" x="450" y="450" text-anchor="middle">bound to the model</text>
  <path class="ln" d="M296 425 H377" marker-end="url(#layers-a)"/>
  <text class="m10" x="338" y="419" text-anchor="middle">tool_use</text>
  <path class="ln" d="M380 447 H299" marker-end="url(#layers-a)"/>
  <text class="m10" x="338" y="461" text-anchor="middle">tool_result</text>

  <text class="m10" x="538" y="402">middleware, in order</text>
  <rect class="b-n" x="538" y="408" width="124" height="20" rx="10"/>
  <text class="ss" x="600" y="422" text-anchor="middle">1 · one call per step</text>
  <rect class="b-n" x="538" y="432" width="124" height="20" rx="10"/>
  <text class="ss" x="600" y="446" text-anchor="middle">2 · Claude fallback</text>
  <rect class="b-n" x="538" y="456" width="124" height="20" rx="10"/>
  <text class="ss" x="600" y="470" text-anchor="middle">3 · prompt caching</text>

  <!-- write corridor -->
  <path class="ln-w dash" d="M691 300 V531" marker-end="url(#layers-w)"/>
  <text class="mw" x="699" y="424">bypasses</text>
  <text class="mw" x="699" y="439">the loop</text>

  <path class="ln" d="M450 465 V531" marker-end="url(#layers-a)"/>
  <text class="mi" x="460" y="502">tool calls</text>

  <!-- tool plane -->
  <rect class="b-layer" x="150" y="520" width="610" height="180" rx="4"/>

  <rect class="b-n" x="166" y="534" width="234" height="152" rx="3"/>
  <text class="s" x="182" y="555">handoffs + memory</text>
  <text class="mi" x="182" y="580">consult_planning</text>
  <text class="mi" x="182" y="598">consult_nutrition</text>
  <text class="mi" x="182" y="616">propose_changes</text>
  <text class="mi" x="182" y="634">remember · forget</text>
  <text class="ma" x="182" y="660">harness.handoff · handoff()</text>
  <text class="m10" x="182" y="675">jumps to another node</text>

  <rect class="b-accn" x="412" y="534" width="152" height="70" rx="3"/>
  <text class="s" x="424" y="553">ask_analyst</text>
  <text class="ma10" x="424" y="572">harness.agent_tool</text>
  <text class="m10" x="424" y="589">SQL · Garmin · TP reads</text>
  <rect class="b-accn" x="412" y="616" width="152" height="70" rx="3"/>
  <text class="s" x="424" y="635">ask_wellness</text>
  <text class="ma10" x="424" y="654">harness.agent_tool</text>
  <text class="m10" x="424" y="671">SQL · lab findings</text>

  <rect class="b-w dash" x="580" y="534" width="164" height="152" rx="3"/>
  <text class="s" x="596" y="555">ToolsCaller</text>
  <text class="m" x="596" y="580">code only</text>
  <text class="m" x="596" y="598">TP + Garmin writes</text>
  <text class="m" x="596" y="616">same MCP sessions</text>
  <text class="m" x="596" y="640">runs only after</text>
  <text class="m" x="596" y="656">approval</text>

  <path class="ln" d="M283 686 V737" marker-end="url(#layers-a)"/>
  <text class="mi" x="291" y="718">memory</text>
  <path class="ln" d="M488 686 V737" marker-end="url(#layers-a)"/>
  <text class="mi" x="496" y="718">SELECT</text>
  <path class="ln-w" d="M662 686 V737" marker-end="url(#layers-w)"/>
  <text class="mw" x="670" y="718">writes</text>

  <!-- systems -->
  <rect class="b-n" x="150" y="740" width="370" height="56" rx="4"/>
  <text class="t" x="335" y="764" text-anchor="middle">Postgres</text>
  <text class="m" x="335" y="783" text-anchor="middle">training tables · Store · lab panels</text>
  <rect class="b-n" x="540" y="740" width="220" height="56" rx="4"/>
  <text class="t" x="650" y="764" text-anchor="middle">Garmin + TP MCP</text>
  <text class="m" x="650" y="783" text-anchor="middle">one stdio session each</text>

  <!-- key -->
  <text class="lab" x="830" y="548">KEY</text>
  <rect class="b-layer" x="830" y="562" width="16" height="16" rx="2"/>
  <text class="ss" x="856" y="575">harness layer</text>
  <rect class="b-accn" x="830" y="590" width="16" height="16" rx="2"/>
  <text class="ss" x="856" y="603">a create_agent loop</text>
  <rect class="b-w" x="830" y="618" width="16" height="16" rx="2"/>
  <text class="ss" x="856" y="631">write path</text>
  <rect class="b-n" x="830" y="646" width="16" height="16" rx="2"/>
  <text class="ss" x="856" y="659">host or outside system</text>
  <text class="ma" x="830" y="687">harness.*</text>
  <text class="ss" x="904" y="687">module doing it</text>
</svg>
